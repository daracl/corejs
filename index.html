<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-compatible" content="IE=edge" />
    <title>Daracl - core</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body onload="init()">
    <div style="padding: 10px">
      <h2>Ajax</h2>
      <table>
        <tr>
          <td> 
            <div><button type="button" onclick="ajaxGet();">get</button></div>
            <div><button type="button" onclick="ajaxPost();">post</button></div>
            <div><button type="button" onclick="ajaxFileUpload();">post file upload</button></div>
            <div><button type="button" onclick="ajaxLoader();">ajax loader</button></div>
            <div><button type="button" onclick="ajaxErr500();">ajax error</button></div>
          </td>
          <td>
            <textarea id="ajaxGetResult" style="height: 168px; width: 874px;"></textarea>
          </td>
        </tr>
      </table>
      <h2>Loading</h2>
      <table>
        <tr>
          <td>
            <button type="button" onclick="viewLoading(1);">view</button>
            <button type="button" onclick="Daracl.loading.destroy('#sample1')">hide</button>
            <div id="sample1" class="loading-area" style="width: 300px; height: 300px">default loading</div>
          </td>
          <td>
            <button type="button" onclick="viewLoading(2);">view</button>
            <button type="button" onclick="Daracl.loading.destroy('#sample2')">hide</button>
            <div id="sample2" class="loading-area" style="width: 300px; height: 300px">content view</div>
          </td>
          <td>
            <button type="button" onclick="viewLoading(3);">view</button>
            <button type="button" onclick="Daracl.loading.destroy('#sample3')">hide</button>
            <div id="sample3" class="loading-area" style="width: 300px; height: 300px">Loading timeout hide</div>
          </td>
        </tr>
        <tr>
          <td>
            <button type="button" onclick="viewLoading(4);">view</button>
            <button type="button" onclick="Daracl.loading.destroy('#sample4')">hide</button>
            <div id="sample4" class="loading-area" style="width: 300px; height: 300px">cancel button</div>
          </td>
          <td>
            <button type="button" onclick="viewLoading(5);">view</button>
            <button type="button" onclick="Daracl.loading.destroy('#sample5')">hide</button>
            <div id="sample5" class="loading-area" style="width: 300px; height: 300px">seconds/div>
          </td>
          <td>
            <div id="sample6" class="loading-area" style="width: 300px; height: 300px">seconds , content , cancel button</div>
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
<script type="module" src="/src/index.ts"></script>

<script type="text/javascript">
(function() {
  function viewLoading(mode) {
    if (mode == 1) {
      Daracl.loading.create("#sample1", {});
      return;
    }

    if (mode == 2) {
      Daracl.loading.create("#sample2", { content: "content" });
      return;
    }

    if (mode == 3) {
      Daracl.loading.create("#sample3", { content: "content", timeout: 2000 });
      return;
    }

    if (mode == 4) {
      Daracl.loading.create("#sample4", {
        enableCancelButton: true,
        callback: function () {
          console.log("1111111");
        },
      });
      return;
    }

    if (mode == 5) {
      Daracl.loading.create("#sample5", { enableCancelButton: true, enableTime: true });
      return;
    }

    if (mode == 6) {
      Daracl.loading.create("#sample6", { content: "content", enableCancelButton: true, enableTime: true });
      return;
    }
  }
  var loadingObj;
  function loadingView() {
    for (var i = 1; i < 7; i++) {
      viewLoading(i);
    }
  }

  window.init = function  () {
    loadingView()
    initAjax();
  };
  
})();

let ajax;

function initAjax(){
  ajax = Daracl.ajax.create({baseUrl :"http://localhost:3000"}); // 전역 설정
}
function ajaxGet(){
  ajax.get("/api/list", {loaderContainer:"body"
    , data:{aaa:"bbb",ccc:"dddd"}
  }).then((res)=>{
      console.log(res);
      document.getElementById('ajaxGetResult').value = JSON.stringify(res);
  }).catch(err=>{
      console.log('aaa : ',err);
  });
}

let ajaxIdx = 0;
function ajaxPost(){
  ajax.post("/api/item", {loaderContainer:"body"
    , headers:{aaa:"bbb",ccc:"dddd"}
    , data : { name: "test"+ajaxIdx, age: 35+ajaxIdx }
  }).then((res)=>{
      console.log(res);
      document.getElementById('ajaxGetResult').value = JSON.stringify(res);
  }).catch(err=>{
      console.log('aaa : ',err);
  });
}

function ajaxLoader(){
  ajax.get("/api/longtime", {
    loaderContainer:"body"
    ,loaderOption:{
      enableCancelButton: true,
      callback: function () {
        console.log("1111111");
      },
    }
    , data:{aaa:"bbb",ccc:"dddd"}
  },false).then((res)=>{
      console.log(res);
      document.getElementById('ajaxGetResult').value = JSON.stringify(res);
  }).catch(err=>{
      console.log('ajaxLoader error : ',err);
  });
}

function ajaxErr500(){
  ajax.get("/api/err500", {loaderContainer:"body"
    , data:{aaa:"bbb",ccc:"dddd"}
  }).then((res)=>{
      console.log(res);
      document.getElementById('ajaxGetResult').value = JSON.stringify(res);
  }).catch(err=>{
      console.log('error : ',err);
  });
}

function ajaxFileUpload(){
  ++ajaxIdx;

  const form = new FormData();
  form.append("name", "test"+ajaxIdx);
  form.append("age", 35+ajaxIdx);
  const file = new File(["hello world"], "test.txt", { type: "text/plain" });
  form.append("file", file);

  ajax.post("/api/item",{loaderContainer:"body"
    , headers:{aaa:"bbb",ccc:"dddd"}
    , data : form
  }).then((res)=>{
      console.log(res);
      document.getElementById('ajaxGetResult').value = JSON.stringify(res);
  }).catch(err=>{
      console.log('aaa : ',err);
  });
} 

</script>
