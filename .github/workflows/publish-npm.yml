name: Publish to npm

on:
  push:
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check version change and npm registry
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { readFileSync } = require('node:fs');
            const { execFileSync } = require('node:child_process');
            const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
            if (context.eventName === 'push') {
              const before = context.payload.before;
              if (before && !/^0+$/.test(before)) {
                const previous = JSON.parse(execFileSync('git', ['show', `${before}:package.json`], { encoding: 'utf8' }));
                if (previous.version === pkg.version) {
                  core.notice('버전 변경이 없어 배포를 건너뜁니다.');
                  return;
                }
              }
            }
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/${encodeURIComponent(pkg.version)}`);
            if (response.ok) {
              core.notice(`${pkg.name}@${pkg.version}은 이미 배포되어 있습니다.`);
              return;
            }
            if (response.status !== 404) throw new Error(`npm registry 조회 실패: ${response.status}`);
            core.setOutput('publish', 'true');
            core.setOutput('tag', pkg.version.includes('-') ? 'next' : 'latest');

      - uses: actions/setup-node@v4
        if: steps.release.outputs.publish == 'true'
        with:
          node-version: 24.20.0

      - name: Prepare npm and dependencies
        if: steps.release.outputs.publish == 'true'
        run: |
          npm install --global npm@12.2.1
          npm ci

      - name: Verify source and build contracts
        if: steps.release.outputs.publish == 'true'
        run: |
          npm run verify
          npm run test:scripts
          npm audit --omit=dev

      - name: Verify release package
        if: steps.release.outputs.publish == 'true'
        run: npm run test:package

      - name: Publish with npm trusted publishing
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: npm publish --access public --provenance --tag "$RELEASE_TAG"
