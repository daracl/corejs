<script>
    document.getElementById('main').addEventListener('click', (evt) => {
        const srcElement = evt.target;
        const selector = '.event-target';

        const selectorEle = srcElement.closest(selector);

        if (selectorEle) {
            console.log(selectorEle);
        }

    })

    function hasClass(element, clazz) {
        return element.classList.contains(clazz);
    }
