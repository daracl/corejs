<!doctype html>
<html dir="ltr">

<head>
    <meta charset="utf-8">

    <script src="/dist/dara.web.js"></script>
    <script src="/custom/dara.web.custom.js"></script>

    <style>
    </style>

</head>

<body onload="loadFileUploader()">

    <div><button onclick="download()">file download</button></div>
    <div><button onclick="errorDownload()">file download error</button></div>

    <h2>파일 업로드 영역</h2>
    <div id="fileUploader">
        <div class="add-file-upload-area">asdfasdf</div>
    </div>
    <div id="fileUploadPreview"></div>
</body>
<script>
    const download = () => {
        AppWeb.file.download('/data/fileDownload.zip', {})
    }

    const errorDownload = () => {
        AppWeb.file.download('/data/fileDown11.json', {})
    }

    var fileUploader;
    function loadFileUploader() {
        if (fileUploader) {
            fileUploader.destroy();
        }

        AppWeb.resource.load('fileupload').then((item) => {
            fileUploader = AppWeb.ui.createUploader('#fileUploader', {
                files: [
                    {
                        "fileId": "93b678f4775e438cbbe3d3e9085b9fd0",
                        "name": "h2-2.1.214.jar",
                        "size": 2543012,
                        "displaySize": "2.43 MB"
                    }
                ]
                , options: {
                    url: AppWeb.getUrl('/driverMgmt/save')
                    , params: {
                        div: 'driver'
                        , fileExtensions: ''
                    }
                    , previewsContainer: '#fileUploadPreview'
                    , maxFiles: 5
                    , clickable: '.add-file-upload-area'
                }
                , autoDiscover: false
                , extensions: ''
                , enableAddFileButton: false
                , enableDownloadButton: true
                , duplicateIgnore: true
                , callback: {
                    complete: function (file, resp) {
                        console.log(file, resp);
                    }
                    , removeFile: function (file) {
                        console.log(file);
                    }
                    , download: function (file) {
                        console.log('download', file);
                        //AppWeb.file.download(AppWeb.util.replaceUrlParameter('<vpi:url type="driverFileDownload" />', file));
                    }
                }
            });

        });
    }

</script>

</html>
